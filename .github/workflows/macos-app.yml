name: App bauen

# Baut die Doppelklick-App auf Mac- und Windows-Runnern und legt
# .dmg/.zip als Artifact ab. Bei Tags v* zusätzlich als GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          # macos-13 ist seit Dez. 2025 abgeschaltet; letztes GitHub-Intel-Image:
          - os: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 (inkl. Tcl/Tk vom python.org-Installer)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Architektur prüfen
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          echo "Runner: $actual  erwartet: ${{ matrix.arch }}"
          test "$actual" = "${{ matrix.arch }}"

      - name: App und DMG bauen
        run: ./scripts/build_macos.sh
        env:
          PYTHON: python

      - name: Artifacts hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PDF-zu-Markdown-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/PDF-zu-Markdown-*-macos-*.dmg
            dist/PDF-zu-Markdown-*-macos-*.zip

  windows:
    name: Build (windows-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: App und ZIP bauen
        shell: powershell
        run: ./scripts/build_windows.ps1
        env:
          PYTHON: python

      - name: Artifacts hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PDF-zu-Markdown-windows-x64
          if-no-files-found: error
          path: "dist/PDF zu Markdown/"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (für die Release-Beschreibung)
        uses: actions/checkout@v4

      - name: Artifacts laden
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Windows-Ordner als eine ZIP-Datei
        run: |
          zip -r artifacts/PDF-zu-Markdown-windows-x64.zip artifacts/PDF-zu-Markdown-windows-x64

      - name: Release mit DMG/ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PDF-zu-Markdown-macos-arm64/*
            artifacts/PDF-zu-Markdown-macos-x86_64/*
            artifacts/PDF-zu-Markdown-windows-x64.zip
          body_path: packaging/release-notes.md
          fail_on_unmatched_files: true
