name: macOS App

# Baut die Doppelklick-App auf echten Mac-Runnern und legt .dmg/.zip
# als Artifact ab. Bei Tags v* zusätzlich als GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          # macos-13 ist seit Dez. 2025 abgeschaltet; letztes GitHub-Intel-Image:
          - os: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 (inkl. Tcl/Tk vom python.org-Installer)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Architektur prüfen
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          echo "Runner: $actual  erwartet: ${{ matrix.arch }}"
          test "$actual" = "${{ matrix.arch }}"

      - name: App und DMG bauen
        run: ./scripts/build_macos.sh
        env:
          PYTHON: python

      - name: Artifacts hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PDF-zu-Markdown-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/PDF-zu-Markdown-*-macos-*.dmg
            dist/PDF-zu-Markdown-*-macos-*.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Artifacts laden
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release mit DMG/ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/PDF-zu-Markdown-*
          generate_release_notes: true
          fail_on_unmatched_files: true
